<title>BIBLING</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Square+Neo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

/* ── CSS 변수 ─────────────────────────────────────────── */
:root {
  --accent:     #A2BECE;   /* PANTONE 14-4311 TCX */
  --accent-mid: #8AAFC0;
  --accent-deep:#6B96AB;
  --accent-bg:  #EAF2F7;
  --bg:         #F7F4EF;
  --surface:    #FFFFFF;
  --surface2:   #F2EFE9;
  --border:     #E2DDD6;
  --border-mid: #CCC7BF;
  --text:       #2C2924;
  --text-mid:   #7A746C;
  --text-light: #B0A99F;
  --tag-read:   #D4E8D4;
  --tag-study:  #D4DCF0;
  --tag-medi:   #F0EAD4;
  --tag-pray:   #F0D4DC;
  --tag-memo:   #E2D4F0;
  --tag-spirit: #D4F0EC;
  --tag-memo2:  #F0E4D4;
  --rs: 12px;
  --rs-lg: 16px;
  --shadow: 0 2px 12px rgba(44,41,36,.07);
  --shadow-md: 0 4px 24px rgba(44,41,36,.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Pretendard', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

/* ── 레이아웃 ─────────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; background: var(--bg); }

/* ── 헤더 ─────────────────────────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 12px;
  flex-shrink: 0;
}
.header-top { display: flex; align-items: center; justify-content: space-between; }
.brand {
  font-family: 'Nanum Square Neo', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 6px;
  color: var(--text);
}
.brand span { color: var(--accent-deep); }
.header-sub { font-size: 11px; color: var(--text-light); margin-top: 2px; letter-spacing: 0.5px; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px;
  border: none; border-radius: 50%;
  background: var(--surface2);
  color: var(--text-mid);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: background .15s;
}
.icon-btn:hover { background: var(--border); }
.icon-btn.accent { background: var(--accent); color: white; }

/* ── 탭 바 ────────────────────────────────────────────── */
.tab-bar {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  flex-shrink: 0;
  gap: 4px;
}
.tab-btn {
  padding: 10px 14px 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  border: none;
  background: none;
  cursor: pointer;

}

/* ── 검색바 ───────────────────────────────────────────── */
.search-bar {

/* ── 오늘의 말씀 (하단 고정) ─────────────────────────── */

<body>
<div id="app">

<script>
/* ── 상수 ─────────────────────────────────────────────────────── */
const TAGS = ['읽음','연구','묵상','기도','암송','깨달음','메모'];
const TAG_EMOJI = { 읽음:'📖', 연구:'🔍', 묵상:'🤍', 기도:'🙏', 암송:'✨', 깨달음:'💡', 메모:'📝' };
const STORAGE_KEY = 'biblitory_v1';

/* ── 상태 ─────────────────────────────────────────────────────── */
let state = { verses: [] };
let currentVerseId = null;
let currentFilter = '전체';
let editingNoteIndex = null;
let editingNoteVerseId = null;

/* ── 저장/로드 ────────────────────────────────────────────────── */
function load() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { verses: [] }; }
  catch { state = { verses: [] }; }
  if (!state.verses) state.verses = [];
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ── 탭 전환 ──────────────────────────────────────────────────── */
function setTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['list','stats','memo'].forEach(t => {
    document.getElementById('tab-'+t).style.display = (t===name)?'block':'none';
  });
  if (name==='stats') renderStats();
  if (name==='memo') renderMemo();
}

/* ── 필터 ─────────────────────────────────────────────────────── */
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

/* ── 구절 목록 렌더 ───────────────────────────────────────────── */
function renderList() {
  const q = (document.getElementById('searchInput')?.value||'').toLowerCase();
  let verses = state.verses;
  if (currentFilter !== '전체') {
    verses = verses.filter(v => v.tags && v.tags.includes(currentFilter));
  }
  if (q) {
    verses = verses.filter(v =>
      v.ref.toLowerCase().includes(q) ||
      (v.text||'').toLowerCase().includes(q) ||
      (v.notes||[]).some(n => n.text.toLowerCase().includes(q))
    );
  }
  const el = document.getElementById('verseList');
  if (!verses.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">✦</div>
      <div class="empty-title">기록된 구절이 없어요</div>
      <div class="empty-sub">말씀을 읽다 마음에 새겨진 구절을<br>+ 버튼으로 기록해보세요</div>
    </div>`;
    return;
  }
  el.innerHTML = verses.slice().reverse().map(v => {
    const noteCount = (v.notes||[]).length;
    const tags = (v.tags||[]).map(t =>
      `<span class="tag ${t}">${TAG_EMOJI[t]||''} ${t}</span>`).join('');
    return `<div class="verse-card" onclick="openDetail('${v.id}')">
      <div class="vc-header">
        <div class="vc-ref">${escHtml(v.ref)}</div>
        <div class="vc-ver">${escHtml(v.version||'개역개정')}</div>
      </div>
      ${v.text ? `<div class="vc-text">"${escHtml(v.text.slice(0,80))}${v.text.length>80?'…':''}"</div>` : ''}
      ${tags ? `<div class="vc-tags">${tags}</div>` : ''}
      <div class="vc-footer">
        <div class="vc-date">${v.date||''}</div>
        <div class="vc-note-count">${noteCount > 0 ? `📝 ${noteCount}` : ''}${(v.questions||[]).length > 0 ? ` ❓ ${(v.questions||[]).length}` : ''}</div>
      </div>
    </div>`;
  }).join('');
}

/* ── 상세 열기 ────────────────────────────────────────────────── */
function openDetail(id) {
  currentVerseId = id;
  renderDetail();
  openSheet('detailOverlay');
}
function renderDetail() {
  const v = state.verses.find(x=>x.id===currentVerseId);
  if (!v) return;
  const notes = v.notes||[];
  const notesHtml = notes.map((n, i) => `
    <div class="note-item">
      <div class="note-item-header">
        <span class="note-tag-label tag ${n.tag}" style="font-size:11px">${TAG_EMOJI[n.tag]||''} ${n.tag}</span>
        <span class="note-date">${n.date||''}</span>
      </div>
      <div class="note-text">${escHtml(n.text).replace(/\n/g,'<br>')}</div>
      <div class="note-actions">
        <button class="note-act-btn" onclick="editNote(${i})">편집</button>
        <button class="note-act-btn" onclick="deleteNote(${i})">삭제</button>
      </div>
    </div>
  `).join('');
  const questions = v.questions||[];
  const questionsHtml = questions.map((q, i) => `
    <div class="note-item" style="border-left:2px solid #E8C97A">
      <div class="note-item-header">
        <span style="font-size:11px;font-weight:700;color:#8A6A1A">❓ 질문</span>
        <span class="note-date">${q.date||''}</span>
      </div>
      <div class="note-text">${escHtml(q.text).replace(/\n/g,'<br>')}</div>
      <div class="note-actions">
        <button class="note-act-btn" onclick="editQuestion(${i})">편집</button>
        <button class="note-act-btn" onclick="deleteQuestion(${i})">삭제</button>
      </div>
    </div>
  `).join('');
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-ref">${escHtml(v.ref)} <span style="font-size:12px;font-weight:400;color:var(--accent-deep)">${escHtml(v.version||'개역개정')}</span></div>
    ${v.text ? `<div class="detail-verse-text">"${escHtml(v.text)}"</div>` : ''}
    <div style="margin-bottom:8px">
      <div class="vc-tags" style="padding:0">${(v.tags||[]).map(t=>`<span class="tag ${t}">${TAG_EMOJI[t]||''} ${t}</span>`).join('')}</div>
    </div>
    <div style="font-size:12px;color:var(--text-light);margin-bottom:16px">처음 기록: ${v.date||''}</div>
    <div class="detail-section-title">
      <span>📝 기록 & 연구 노트 (${notes.length}개)</span>
      <button class="add-note-btn" onclick="openNoteSheet()">＋ 추가</button>
    </div>
    ${notesHtml || `<div style="text-align:center;padding:20px 0;color:var(--text-light);font-size:13px">아직 기록이 없어요</div>`}
    <div class="detail-section-title" style="margin-top:20px">
      <span>❓ 궁금한 점 (${questions.length}개)</span>
      <button class="add-note-btn" style="background:#FDF3D4;color:#8A6A1A" onclick="openQuestionSheet()">＋ 추가</button>
    </div>
    ${questionsHtml || `<div style="text-align:center;padding:20px 0;color:var(--text-light);font-size:13px">궁금한 점을 기록해두세요</div>`}
  `;
}

/* ── 구절 추가/저장 ───────────────────────────────────────────── */
function openAddSheet(editId) {
  const isEdit = !!editId;
  document.getElementById('addSheetTitle').textContent = isEdit ? '구절 편집' : '새 구절 기록';
  buildTagPicker('tagPicker', TAGS, isEdit ? (state.verses.find(v=>v.id===editId)?.tags||[]) : []);
  if (isEdit) {
    const v = state.verses.find(x=>x.id===editId);
    document.getElementById('fRef').value = v.ref||'';
    document.getElementById('fVer').value = v.version||'개역개정';
    document.getElementById('fText').value = v.text||'';
    document.getElementById('fDate').value = v.date||todayStr();
    document.getElementById('fNote').value = '';
    document.getElementById('addOverlay').dataset.editId = editId;
  } else {
    document.getElementById('fRef').value = '';
    document.getElementById('fVer').value = '개역개정';
    document.getElementById('fText').value = '';
    document.getElementById('fDate').value = todayStr();
    document.getElementById('fNote').value = '';
    delete document.getElementById('addOverlay').dataset.editId;
  }
  openSheet('addOverlay');
}
function saveVerse() {
  const ref = document.getElementById('fRef').value.trim();
  if (!ref) { alert('구절을 입력해주세요.'); return; }
  const editId = document.getElementById('addOverlay').dataset.editId;
  const tags = getSelectedTags('tagPicker');
  const noteText = document.getElementById('fNote').value.trim();
  if (editId) {
    const v = state.verses.find(x=>x.id===editId);
    if (v) {
      v.ref = ref;
      v.version = document.getElementById('fVer').value;
      v.text = document.getElementById('fText').value.trim();
      v.date = document.getElementById('fDate').value;
      v.tags = tags;
    }
  } else {
    const v = {
      id: Date.now().toString(),
      ref, version: document.getElementById('fVer').value,
      text: document.getElementById('fText').value.trim(),
      date: document.getElementById('fDate').value,
      tags,
      notes: []
    };
    if (noteText) {
      v.notes.push({ tag: tags[0]||'메모', text: noteText, date: todayStr() });
    }
    state.verses.push(v);
  }
  save(); renderList(); closeSheet('addOverlay');
}

/* ── 구절 삭제/편집 ───────────────────────────────────────────── */
function deleteCurrentVerse() {
  if (!confirm('이 구절과 모든 기록을 삭제할까요?')) return;
  state.verses = state.verses.filter(v=>v.id!==currentVerseId);
  save(); renderList(); closeSheet('detailOverlay');
}
function editCurrentVerse() {
  closeSheet('detailOverlay');
  setTimeout(() => openAddSheet(currentVerseId), 300);
}

/* ── 노트 시트 ────────────────────────────────────────────────── */
function openNoteSheet(noteIdx) {
  editingNoteIndex = (noteIdx !== undefined) ? noteIdx : null;
  editingNoteVerseId = currentVerseId;
  const v = state.verses.find(x=>x.id===currentVerseId);
  const existing = (noteIdx !== undefined) ? v.notes[noteIdx] : null;
  document.getElementById('noteSheetTitle').textContent = existing ? '기록 편집' : '기록 추가';
  buildTagPicker('noteTagPicker', ['연구','묵상','기도','암송','깨달음','메모'], existing ? [existing.tag] : []);
  document.getElementById('nText').value = existing ? existing.text : '';
  openSheet('noteOverlay');
}
function saveNote() {
  const text = document.getElementById('nText').value.trim();
  if (!text) { alert('내용을 입력해주세요.'); return; }
  const tag = getSelectedTags('noteTagPicker')[0] || '메모';
  const v = state.verses.find(x=>x.id===editingNoteVerseId);
  if (!v) return;
  if (editingNoteIndex !== null) {
    v.notes[editingNoteIndex] = { ...v.notes[editingNoteIndex], tag, text, date: todayStr() };
  } else {
    if (!v.notes) v.notes = [];
    v.notes.push({ tag, text, date: todayStr() });
    // 태그도 자동 추가
    if (!v.tags.includes(tag)) v.tags.push(tag);
  }
  save(); closeSheet('noteOverlay');
  setTimeout(() => { openDetail(editingNoteVerseId); }, 300);
}
function editNote(i) {
  closeSheet('detailOverlay');
  setTimeout(() => { openNoteSheet(i); }, 300);
}
function deleteNote(i) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  const v = state.verses.find(x=>x.id===currentVerseId);
  v.notes.splice(i, 1);
  save(); renderDetail();
}

/* ── 질문 기록 ────────────────────────────────────────────────── */
let editingQuestionIndex = null;

function openQuestionSheet(qIdx) {
  editingQuestionIndex = (qIdx !== undefined) ? qIdx : null;
  const v = state.verses.find(x=>x.id===currentVerseId);
  const existing = (qIdx !== undefined) ? (v.questions||[])[qIdx] : null;
  document.getElementById('questionSheetTitle').textContent = existing ? '질문 편집' : '질문 기록';
  document.getElementById('qText').value = existing ? existing.text : '';
  openSheet('questionOverlay');
}
function saveQuestion() {
  const text = document.getElementById('qText').value.trim();
  if (!text) { alert('질문 내용을 입력해주세요.'); return; }
  const v = state.verses.find(x=>x.id===currentVerseId);
  if (!v.questions) v.questions = [];
  if (editingQuestionIndex !== null) {
    v.questions[editingQuestionIndex] = { text, date: todayStr() };
  } else {
    v.questions.push({ text, date: todayStr() });
  }
  save(); closeSheet('questionOverlay');
  setTimeout(() => renderDetail(), 50);
}
function editQuestion(i) {
  openQuestionSheet(i);
}
function deleteQuestion(i) {
  if (!confirm('이 질문을 삭제할까요?')) return;
  const v = state.verses.find(x=>x.id===currentVerseId);
  v.questions.splice(i, 1);
  save(); renderDetail();
}

/* ── 통계 ─────────────────────────────────────────────────────── */
function renderStats() {
  const el = document.getElementById('statsContent');
  const total = state.verses.length;
  const noteTotal = state.verses.reduce((a,v)=>a+(v.notes||[]).length,0);
  const tagCounts = {};
  TAGS.forEach(t => tagCounts[t] = 0);
  state.verses.forEach(v => (v.tags||[]).forEach(t => { if (tagCounts[t]!==undefined) tagCounts[t]++; }));
  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">수집 구절</div></div>
      <div class="stat-card"><div class="stat-num">${noteTotal}</div><div class="stat-label">기록 노트</div></div>
      <div class="stat-card"><div class="stat-num">${tagCounts['암송']||0}</div><div class="stat-label">암송 구절</div></div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rs-lg);padding:18px;margin-bottom:12px">
      <div class="detail-section-title" style="margin-bottom:14px"><span>활동별 현황</span></div>
      ${TAGS.map(t => `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="width:60px;font-size:12px;font-weight:700;color:var(--text-mid)">${TAG_EMOJI[t]} ${t}</span>
          <div style="flex:1;background:var(--surface2);border-radius:4px;height:8px;overflow:hidden">
            <div style="height:100%;background:var(--accent);border-radius:4px;width:${total?Math.round((tagCounts[t]/total)*100):0}%;transition:width .4s"></div>
          </div>
          <span style="font-size:12px;color:var(--text-light);width:20px;text-align:right">${tagCounts[t]}</span>
        </div>`).join('')}
    </div>
    ${total===0?`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">아직 기록이 없어요</div></div>`:''}
  `;
}

/* ── 묵상 메모 탭 ─────────────────────────────────────────────── */
function renderMemo() {
  const el = document.getElementById('memoContent');
  const notes = [];
  state.verses.forEach(v => {
    (v.notes||[]).forEach(n => {
      if (['묵상','기도','깨달음'].includes(n.tag)) {
        notes.push({ ...n, ref: v.ref });
      }
    });
  });
  if (!notes.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🤍</div><div class="empty-title">묵상 기록이 없어요</div><div class="empty-sub">구절에 묵상, 기도, 깨달음을 추가하면<br>여기서 모아볼 수 있어요</div></div>`;
    return;
  }
  el.innerHTML = notes.slice().reverse().map(n => `
    <div class="note-item" style="margin-bottom:12px">
      <div class="note-item-header">
        <span class="tag ${n.tag}" style="font-size:11px">${TAG_EMOJI[n.tag]} ${n.tag}</span>
        <span class="note-date">${n.date||''}</span>
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--accent-deep);margin-bottom:6px">📖 ${escHtml(n.ref)}</div>
      <div class="note-text">${escHtml(n.text).replace(/\n/g,'<br>')}</div>
    </div>
  `).join('');
}

/* ── 백업 ─────────────────────────────────────────────────────── */
function openBackup() {
  renderBackup();
  openSheet('backupOverlay');
}
function renderBackup() {
  const el = document.getElementById('backupBody');
  el.innerHTML = `
    <div class="backup-card">
      <div class="backup-card-title">📤 데이터 내보내기</div>
      <div class="backup-card-sub">현재 저장된 ${state.verses.length}개 구절과 모든 기록을 JSON 파일로 내보냅니다.</div>
      <button class="backup-btn primary" onclick="downloadBackup()">📥 JSON 파일로 다운로드</button>
      <button class="backup-btn" onclick="copyBackup()">📋 클립보드에 복사</button>
    </div>
    <div class="backup-card">
      <div class="backup-card-title">📂 데이터 복원</div>
      <div class="backup-card-sub">이전에 백업한 JSON 파일을 선택하면 데이터가 복원됩니다.<br><strong>⚠️ 현재 데이터가 모두 교체됩니다.</strong></div>
      <button class="backup-btn" onclick="document.getElementById('restoreInput').click()">📁 백업 파일 선택</button>
      <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="handleRestoreFile(event)">
      <div id="restoreMsg"></div>
    </div>
  `;
}
function makeBackup() {
  return JSON.stringify({ version:1, exportedAt: new Date().toISOString(), ...state }, null, 2);
}
function downloadBackup() {
  const blob = new Blob([makeBackup()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `biblitory_backup_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function copyBackup() {
  navigator.clipboard.writeText(makeBackup()).then(() => {
    alert('클립보드에 복사됐어요!');
  });
}
function handleRestoreFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed.verses) throw new Error('형식 오류');
      const msg = document.getElementById('restoreMsg');
      msg.innerHTML = `<div class="restore-msg">📦 구절 ${parsed.verses.length}개 발견됨\n내보낸 날짜: ${(parsed.exportedAt||'').slice(0,10)}\n\n<button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="confirmRestore(${JSON.stringify(JSON.stringify(parsed))})">복원 시작하기</button></div>`;
    } catch { document.getElementById('restoreMsg').innerHTML = '<div class="restore-msg" style="color:#C0392B">❌ 올바른 Biblitory 백업 파일이 아닙니다.</div>'; }
  };
  reader.readAsText(file);
}
function confirmRestore(jsonStr) {
  if (!confirm('현재 데이터가 모두 교체됩니다. 복원할까요?')) return;
  const parsed = JSON.parse(jsonStr);
  state = { verses: parsed.verses };
  save(); renderList(); closeSheet('backupOverlay');
  alert('✅ 복원 완료!');
}

/* ── 유틸 ─────────────────────────────────────────────────────── */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function escHtml(s='') {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function buildTagPicker(containerId, tags, selected=[]) {
  document.getElementById(containerId).innerHTML = tags.map(t =>
    `<div class="tag-opt ${selected.includes(t)?'sel':''}" onclick="toggleTag(this,'${containerId}')">${TAG_EMOJI[t]||''} ${t}</div>`
  ).join('');
}
function toggleTag(el, containerId) {
  // 주태그 픽커는 다중선택, 노트 태그는 단일선택
  if (containerId === 'noteTagPicker') {
    document.querySelectorAll(`#${containerId} .tag-opt`).forEach(e => e.classList.remove('sel'));
  }
  el.classList.toggle('sel');
}
function getSelectedTags(containerId) {
  return [...document.querySelectorAll(`#${containerId} .tag-opt.sel`)].map(e => e.textContent.trim().replace(/^[^ ]+ /,''));
}
function openSheet(id) { document.getElementById(id).classList.add('open'); }
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function closeIfBg(e, id) { if (e.target === document.getElementById(id)) closeSheet(id); }

renderDailyWord();
