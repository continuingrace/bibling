<title>BIBLING</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Square+Neo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

/* ── CSS 변수 ─────────────────────────────────────────── */
:root {
  --accent:     #A2BECE;   /* PANTONE 14-4311 TCX */
  --accent-mid: #8AAFC0;
  --accent-deep:#6B96AB;
  --accent-bg:  #EAF2F7;
  --bg:         #F7F4EF;
  --surface:    #FFFFFF;
  --surface2:   #F2EFE9;
  --border:     #E2DDD6;
  --border-mid: #CCC7BF;
  --text:       #2C2924;
  --text-mid:   #7A746C;
  --text-light: #B0A99F;
  --tag-read:   #D4E8D4;
  --tag-study:  #D4DCF0;
  --tag-medi:   #F0EAD4;
  --tag-pray:   #F0D4DC;
  --tag-memo:   #E2D4F0;
  --tag-spirit: #D4F0EC;
  --tag-memo2:  #F0E4D4;
  --rs: 12px;
  --rs-lg: 16px;
  --shadow: 0 2px 12px rgba(44,41,36,.07);
  --shadow-md: 0 4px 24px rgba(44,41,36,.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; background: #F7F4EF; }
body { height: 100%; background: #F7F4EF; overscroll-behavior: none; }
body {
  font-family: 'Pretendard', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ── 레이아웃 ─────────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; background: var(--bg); }

/* ── 헤더 ─────────────────────────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 12px;
  flex-shrink: 0;
}
.header-top { display: flex; align-items: center; justify-content: space-between; }
.brand {
  font-family: 'Nanum Square Neo', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 6px;
  color: var(--text);
}
.brand span { color: var(--accent-deep); }
.header-sub { font-size: 11px; color: var(--text-light); margin-top: 2px; letter-spacing: 0.5px; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px;
  border: none; border-radius: 50%;
  background: var(--surface2);
  color: var(--text-mid);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: background .15s;
}
.icon-btn:hover { background: var(--border); }
.icon-btn.accent { background: var(--accent); color: white; }

/* ── 탭 바 ────────────────────────────────────────────── */
.tab-bar {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  flex-shrink: 0;
  gap: 4px;
}
.tab-btn {
  padding: 10px 14px 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  font-family: 'Pretendard', sans-serif;
  white-space: nowrap;
}
.tab-btn.active { color: var(--accent-deep); border-bottom-color: var(--accent-deep); }

/* ── 스크롤 영역 ──────────────────────────────────────── */
.scroll-area { flex: 1; overflow-y: auto; padding: 16px; }
.scroll-area::-webkit-scrollbar { width: 3px; }
.scroll-area::-webkit-scrollbar-track { background: transparent; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }

/* ── 빈 상태 ──────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 60px 20px; text-align: center;
}
.empty-icon { font-size: 48px; opacity: .5; }
.empty-title { font-size: 16px; font-weight: 700; color: var(--text-mid); }
.empty-sub { font-size: 13px; color: var(--text-light); line-height: 1.6; }

/* ── 구절 카드 ────────────────────────────────────────── */
.verse-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--rs-lg);
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.verse-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }


.vc-header {
  padding: 14px 16px 10px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.vc-ref {
  font-family: 'Nanum Square Neo', sans-serif;
  font-weight: 800;
  font-size: 15px;
  color: var(--text);
  line-height: 1.3;
  flex: 1;
}
.vc-ver {
  font-size: 10px; font-weight: 700;
  color: var(--accent-deep);
  background: var(--accent-bg);
  border-radius: 4px;
  padding: 2px 7px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 2px;
}
.vc-text {
  padding: 0 16px 12px;
  font-size: 13px;
  color: var(--text-mid);
  line-height: 1.7;
}
.vc-tags { display: flex; gap: 5px; padding: 0 16px; flex-wrap: wrap; margin-bottom: 10px; }
.tag {
  font-size: 10px; font-weight: 700;
  border-radius: 20px;
  padding: 3px 9px;
  display: flex; align-items: center; gap: 3px;
}
.tag.읽음   { background: var(--tag-read);   color: #3A7A3A; }
.tag.연구   { background: var(--tag-study);  color: #3A4A8A; }
.tag.묵상   { background: var(--tag-medi);   color: #8A7A2A; }
.tag.기도   { background: var(--tag-pray);   color: #8A2A4A; }
.tag.암송   { background: var(--tag-memo);   color: #5A2A8A; }
.tag.깨달음 { background: var(--tag-spirit); color: #1A7A6A; }
.tag.메모   { background: var(--tag-memo2);  color: #7A4A1A; }

.vc-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.vc-date { font-size: 11px; color: var(--text-light); }
.vc-note-count { font-size: 11px; color: var(--accent-deep); font-weight: 600; }

/* ── FAB ──────────────────────────────────────────────── */
.fab {
  position: fixed;
  bottom: 24px; right: calc(50% - 240px + 20px);
  width: 52px; height: 52px;
  background: var(--accent-deep);
  color: white;
  border: none;
  border-radius: 50%;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(107,150,171,.4);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, box-shadow .15s;
  z-index: 100;
}
.fab:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(107,150,171,.5); }
@media (max-width: 480px) { .fab { right: 20px; } }

/* ── 모달 오버레이 ─────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(44,41,36,.45);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .22s;
}
.overlay.open { opacity: 1; pointer-events: all; }

/* ── 바텀 시트 ────────────────────────────────────────── */
.sheet {
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  max-height: 92vh;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .26s cubic-bezier(.32,0,.67,0);
}
.overlay.open .sheet { transform: translateY(0); transition-timing-function: cubic-bezier(.33,1,.68,1); }
.sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
.sheet-header { padding: 14px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sheet-title { font-family: 'Nanum Square Neo', sans-serif; font-weight: 800; font-size: 17px; }
.sheet-sub { font-size: 12px; color: var(--text-light); margin-top: 3px; }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
.sheet-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }

/* ── 폼 ───────────────────────────────────────────────── */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 700; color: var(--text-mid); margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: var(--rs);
  padding: 11px 14px;
  font-size: 14px;
  font-family: 'Pretendard', sans-serif;
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: none; line-height: 1.6; min-height: 90px; }
.form-row { display: flex; gap: 8px; }
.form-row .form-group { flex: 1; }

/* ── 태그 선택기 ──────────────────────────────────────── */
.tag-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-opt {
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  color: var(--text-mid);
  background: var(--surface2);
  transition: all .15s;
}
.tag-opt.sel { border-color: var(--accent-deep); background: var(--accent-bg); color: var(--accent-deep); }

/* ── 버튼 ─────────────────────────────────────────────── */
.btn { padding: 13px 20px; border-radius: var(--rs); font-size: 14px; font-weight: 700; border: none; cursor: pointer; font-family: 'Pretendard', sans-serif; transition: opacity .15s; }
.btn:active { opacity: .8; }
.btn-ghost { background: var(--surface2); color: var(--text-mid); }
.btn-primary { background: var(--accent-deep); color: white; flex: 1; }
.btn-danger { background: #FDE8E8; color: #C0392B; }

/* ── 노트 아이템 (상세 내부) ──────────────────────────── */
.note-item {
  border: 1px solid var(--border);
  border-radius: var(--rs);
  padding: 14px;
  margin-bottom: 10px;
  background: var(--surface);

.note-act-btn { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-mid); cursor: pointer; font-family: 'Pretendard', sans-serif; }
.note-act-btn:hover { background: var(--border); }

/* ── 상세 모달 내 구절 헤더 ───────────────────────────── */

.restore-msg {
  background: var(--surface2);

  line-height: 1.6;

}

/* ── 검색바 ───────────────────────────────────────────── */

  display: flex; align-items: center; gap: 8px;

  border: 1.5px solid var(--border);

}

}

/* ── 정렬/필터 바 ─────────────────────────────────────── */
.filter-bar { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-chip {

}

/* ── 통계 카드 ────────────────────────────────────────── */

/* ── 성경 읽기표 ──────────────────────────────────────────────── */

.ch-box {

<script>
/* ── 상수 ─────────────────────────────────────────────────────── */
const TAGS = ['읽음','연구','묵상','기도','암송','깨달음','메모'];
const TAG_EMOJI = { 읽음:'📖', 연구:'🔍', 묵상:'🤍', 기도:'🙏', 암송:'✨', 깨달음:'💡', 메모:'📝' };
const STORAGE_KEY = 'biblitory_v1';

/* ── 상태 ─────────────────────────────────────────────────────── */
let state = { verses: [] };
let currentVerseId = null;
let currentFilter = '전체';
let editingNoteIndex = null;
let editingNoteVerseId = null;

/* ── 저장/로드 ────────────────────────────────────────────────── */
function load() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { verses: [] }; }
  catch { state = { verses: [] }; }
  if (!state.verses) state.verses = [];
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ── 탭 전환 ──────────────────────────────────────────────────── */
function setTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['list','stats','memo','reading'].forEach(t => {
    document.getElementById('tab-'+t).style.display = (t===name)?'block':'none';
  });
  if (name==='stats') renderStats();
  if (name==='memo') renderMemo();
  if (name==='reading') renderReading();
}

/* ── 필터 ─────────────────────────────────────────────────────── */
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

let monthViewActive = false;
let selectedYM = ''; // 'YYYY-MM'

function toggleMonthView() {
  monthViewActive = !monthViewActive;
  if (monthViewActive) {
    calViewActive = false;
    document.getElementById('calNav').style.display = 'none';
    document.getElementById('calToggleBtn').style.color = 'var(--text-light)';
    // 선택된 월 = 가장 최근 기록 월
    const months = getAvailableMonths();
    selectedYM = months[0] || '';
    renderMonthChips();
    document.getElementById('monthNav').style.display = 'block';
    document.getElementById('monthToggleBtn').style.color = 'var(--accent-deep)';
  } else {
    document.getElementById('monthNav').style.display = 'none';
    document.getElementById('monthToggleBtn').style.color = 'var(--text-light)';
  }
  renderList();
}

function getAvailableMonths() {
  const set = new Set(state.verses.map(v => (v.date||'').slice(0,7)).filter(Boolean));
  return [...set].sort().reverse();
}

function selectMonth(ym) {
  selectedYM = ym;
  renderMonthChips();
  renderList();
}

function renderMonthChips() {
  const months = getAvailableMonths();
  const el = document.getElementById('monthChips');
  if (!months.length) { el.innerHTML = '<div style="font-size:12px;color:var(--text-light);padding:4px">기록이 없어요</div>'; return; }
  el.innerHTML = months.map(ym => {
    const [y, m] = ym.split('-');
    const label = `${y}.${m}`;
    const active = ym === selectedYM;
    return `<div onclick="selectMonth('${ym}')" style="white-space:nowrap;font-size:11px;font-weight:700;border-radius:20px;padding:5px 13px;border:1.5px solid ${active?'var(--accent-deep)':'var(--border)'};background:${active?'var(--accent-deep)':'var(--surface2)'};color:${active?'white':'var(--text-mid)'};cursor:pointer">${label}</div>`;
  }).join('');
}

/* ── 월별 보기 ────────────────────────────────────────────────── */
let calViewActive = false;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth() + 1; // 1-based

function toggleCalView() {
  calViewActive = !calViewActive;
  if (calViewActive) {
    monthViewActive = false;
    document.getElementById('monthNav').style.display = 'none';
    document.getElementById('monthToggleBtn').style.color = 'var(--text-light)';
    document.getElementById('calToggleBtn').style.color = 'var(--accent-deep)';
    document.getElementById('calNav').style.display = 'block';
    updateCalMonthLabel();
  } else {
    document.getElementById('calToggleBtn').style.color = 'var(--text-light)';
    document.getElementById('calNav').style.display = 'none';
  }
  renderList();
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  if (calMonth < 1)  { calMonth = 12; calYear--; }
  updateCalMonthLabel();
  renderCalGrid();
  renderList();
}

function updateCalMonthLabel() {
  const el = document.getElementById('calMonthLabel');
  if (el) el.textContent = `${calYear}년 ${calMonth}월`;
  renderCalGrid();
}

function renderCalGrid() {
  const el = document.getElementById('calGrid');
  if (!el) return;

  // 이 달에 기록 있는 날짜 set
  const ym = `${calYear}-${String(calMonth).padStart(2,'0')}`;
  const recordDays = new Set(
    state.verses.filter(v => (v.date||'').startsWith(ym)).map(v => v.date.slice(8,10))
  );

  const firstDay = new Date(calYear, calMonth-1, 1).getDay(); // 0=일
  const lastDate = new Date(calYear, calMonth, 0).getDate();
  const today = new Date();
  const isThisMonth = today.getFullYear()===calYear && today.getMonth()+1===calMonth;

  const WD = ['일','월','화','수','목','금','토'];
  let html = `<div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px">
    ${WD.map((d,i) => `<div style="font-size:9px;font-weight:700;text-align:center;padding:3px 0;color:${i===0?'#C05050':i===6?'#5050C0':'var(--text-light)'}">${d}</div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">`;

  // 빈 칸
  for (let i=0; i<firstDay; i++) html += `<div></div>`;

  for (let d=1; d<=lastDate; d++) {
    const dd = String(d).padStart(2,'0');
    const hasRec = recordDays.has(dd);
    const isToday = isThisMonth && today.getDate()===d;
    const dow = (firstDay + d - 1) % 7;
    const isSun = dow === 0, isSat = dow === 6;
    const baseColor = isSun ? '#C05050' : isSat ? '#5050C0' : 'var(--text-mid)';

    html += `<div onclick="selectCalDay('${calYear}-${String(calMonth).padStart(2,'0')}-${dd}')"
      style="aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;font-size:10px;font-weight:${hasRec?'800':'500'};
      color:${isToday?'white':baseColor};
      background:${isToday?'var(--accent-deep)':'transparent'};
      position:relative;gap:2px;transition:background .12s"
      onmouseover="this.style.background=this.style.background||'var(--surface2)'"
    >
      ${d}
      ${hasRec ? `<div style="width:3px;height:3px;border-radius:50%;background:${isToday?'rgba(255,255,255,.7)':'var(--accent-deep)'};"></div>` : '<div style="width:3px;height:3px"></div>'}
    </div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

let calSelectedDay = '';
function selectCalDay(dateStr) {
  calSelectedDay = calSelectedDay === dateStr ? '' : dateStr;
  renderCalGrid();
  // 선택된 날짜만 필터
  const el = document.getElementById('verseList');
  const verses = calSelectedDay
    ? state.verses.filter(v => v.date === calSelectedDay)
    : state.verses.filter(v => (v.date||'').startsWith(`${calYear}-${String(calMonth).padStart(2,'0')}`));

  if (!verses.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">✦</div><div class="empty-title">${calSelectedDay ? calSelectedDay.replace(/-/g,'.') + ' 기록 없음' : '이 달 기록이 없어요'}</div></div>`;
    return;
  }
  let lastDate = '';
  el.innerHTML = verses.slice().reverse().map(v => {
    const noteCount = (v.notes||[]).length;
    const tags = (v.tags||[]).map(t => `<span class="tag ${t}">${TAG_EMOJI[t]||''} ${t}</span>`).join('');
    let dateHeader = '';
    if (!calSelectedDay && v.date && v.date !== lastDate) {
      lastDate = v.date;
      const d = new Date(v.date);
      const dow = ['일','월','화','수','목','금','토'][d.getDay()];
      const [,mm,dd] = v.date.split('-');
      dateHeader = `<div style="font-size:11px;font-weight:700;color:var(--text-light);margin:14px 0 8px;display:flex;align-items:center;gap:8px">${parseInt(mm)}월 ${parseInt(dd)}일 (${dow})<span style="flex:1;height:1px;background:var(--border);display:block"></span></div>`;
    }
    return `${dateHeader}<div class="verse-card" onclick="openDetail('${v.id}')">
      <div class="vc-header"><div class="vc-ref">${escHtml(v.ref)}</div><div class="vc-ver">${escHtml(v.version||'개역개정')}</div></div>
      ${v.text?`<div class="vc-text">"${escHtml(v.text.slice(0,80)).replace(/\n/g,' ')}${v.text.length>80?'…':''}"</div>`:''}
      ${tags?`<div class="vc-tags">${tags}</div>`:''}
      <div class="vc-footer"><div class="vc-date">${v.date||''}</div><div class="vc-note-count">${noteCount>0?`📝 ${noteCount}`:''}${(v.questions||[]).length>0?` ❓ ${(v.questions||[]).length}`:''}</div></div>
    </div>`;
  }).join('');
}

/* ── 구절 목록 렌더 ───────────────────────────────────────────── */
function renderList() {
  const q = (document.getElementById('searchInput')?.value||'').toLowerCase();
  let verses = state.verses;
  if (currentFilter !== '전체') {
    verses = verses.filter(v => v.tags && v.tags.includes(currentFilter));
  }
  if (q) {
    verses = verses.filter(v =>
      v.ref.toLowerCase().includes(q) ||
      (v.text||'').toLowerCase().includes(q) ||
      (v.notes||[]).some(n => n.text.toLowerCase().includes(q))
    );
  }
  // 월별 보기 필터
  if (calViewActive) {
    const ym = `${calYear}-${String(calMonth).padStart(2,'0')}`;
    verses = verses.filter(v => (v.date||'').startsWith(ym));
  } else if (monthViewActive && selectedYM) {
    verses = verses.filter(v => (v.date||'').startsWith(selectedYM));
  }

  const el = document.getElementById('verseList');
  if (!verses.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">✦</div>
      <div class="empty-title">${calViewActive ? `${calYear}년 ${calMonth}월 기록이 없어요` : monthViewActive ? `${selectedYM.replace('-','년 ')}월 기록이 없어요` : '기록된 구절이 없어요'}</div>
      <div class="empty-sub">${calViewActive ? '‹ › 로 다른 달을 확인해보세요' : monthViewActive ? '다른 월을 선택해보세요' : '말씀을 읽다 마음에 새겨진 구절을<br>+ 버튼으로 기록해보세요'}</div>
    </div>`;
    return;
  }

  const sorted = verses.slice().reverse();

  // 달력 / 월별 탭 뷰 — 날짜 구분선 그룹핑
  if (calViewActive || monthViewActive) {
    let lastDate = '';
    el.innerHTML = sorted.map(v => {
      const noteCount = (v.notes||[]).length;
      const tags = (v.tags||[]).map(t =>
        `<span class="tag ${t}">${TAG_EMOJI[t]||''} ${t}</span>`).join('');
      let dateHeader = '';
      if (v.date && v.date !== lastDate) {
        lastDate = v.date;
        const d = new Date(v.date);
        const dow = ['일','월','화','수','목','금','토'][d.getDay()];
        const [,mm,dd] = v.date.split('-');
        dateHeader = `<div style="font-size:11px;font-weight:700;color:var(--text-light);margin:14px 0 8px;padding-left:2px;display:flex;align-items:center;gap:8px">${parseInt(mm)}월 ${parseInt(dd)}일 (${dow})<span style="flex:1;height:1px;background:var(--border);display:block"></span></div>`;
      }
      return `${dateHeader}<div class="verse-card" onclick="openDetail('${v.id}')">
        <div class="vc-header">
          <div class="vc-ref">${escHtml(v.ref)}</div>
          <div class="vc-ver">${escHtml(v.version||'개역개정')}</div>
        </div>
        ${v.text ? `<div class="vc-text">"${escHtml(v.text.slice(0,80)).replace(/\n/g,' ')}${v.text.length>80?'…':''}"</div>` : ''}
        ${tags ? `<div class="vc-tags">${tags}</div>` : ''}
        <div class="vc-footer">
          <div class="vc-date">${v.date||''}</div>
          <div class="vc-note-count">${noteCount > 0 ? `📝 ${noteCount}` : ''}${(v.questions||[]).length > 0 ? ` ❓ ${(v.questions||[]).length}` : ''}</div>
        </div>
      </div>`;
    }).join('');
    return;
  }

  el.innerHTML = sorted.map(v => {
    const noteCount = (v.notes||[]).length;
    const tags = (v.tags||[]).map(t =>
      `<span class="tag ${t}">${TAG_EMOJI[t]||''} ${t}</span>`).join('');
    return `<div class="verse-card" onclick="openDetail('${v.id}')">
      <div class="vc-header">
        <div class="vc-ref">${escHtml(v.ref)}</div>
        <div class="vc-ver">${escHtml(v.version||'개역개정')}</div>
      </div>
      ${v.text ? `<div class="vc-text">"${escHtml(v.text.slice(0,80)).replace(/\n/g,' ')}${v.text.length>80?'…':''}"</div>` : ''}
      ${tags ? `<div class="vc-tags">${tags}</div>` : ''}
      <div class="vc-footer">
        <div class="vc-date">${v.date||''}</div>
        <div class="vc-note-count">${noteCount > 0 ? `📝 ${noteCount}` : ''}${(v.questions||[]).length > 0 ? ` ❓ ${(v.questions||[]).length}` : ''}</div>
      </div>
    </div>`;
  }).join('');
}

/* ── 상세 열기 ────────────────────────────────────────────────── */
function openDetail(id) {
  currentVerseId = id;
  renderDetail();
  openSheet('detailOverlay');
}
function renderDetail() {
  const v = state.verses.find(x=>x.id===currentVerseId);
  if (!v) return;
  const notes = v.notes||[];
  const notesHtml = notes.map((n, i) => `
    <div class="note-item">
      <div class="note-item-header">
        <span class="note-tag-label tag ${n.tag}" style="font-size:11px">${TAG_EMOJI[n.tag]||''} ${n.tag}</span>
        <span class="note-date">${n.date||''}</span>
      </div>
      <div class="note-text">${escHtml(n.text).replace(/\n/g,'<br>')}</div>
      <div class="note-actions">
        <button class="note-act-btn" onclick="editNote(${i})">편집</button>
        <button class="note-act-btn" onclick="deleteNote(${i})">삭제</button>
      </div>
    </div>
  `).join('');
  const questions = v.questions||[];
  const questionsHtml = questions.map((q, i) => `
    <div class="note-item" style="border-left:2px solid #E8C97A">
      <div class="note-item-header">
        <span style="font-size:11px;font-weight:700;color:#8A6A1A">❓ 질문</span>
        <span class="note-date">${q.date||''}</span>
      </div>
      <div class="note-text">${escHtml(q.text).replace(/\n/g,'<br>')}</div>
      <div class="note-actions">
        <button class="note-act-btn" onclick="editQuestion(${i})">편집</button>
        <button class="note-act-btn" onclick="deleteQuestion(${i})">삭제</button>
      </div>
    </div>
  `).join('');
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-ref">${escHtml(v.ref)} <span style="font-size:12px;font-weight:400;color:var(--accent-deep)">${escHtml(v.version||'개역개정')}</span></div>
    ${v.text ? `<div class="detail-verse-text">"${escHtml(v.text).replace(/\n/g,'<br>')}"</div>` : ''}
    <div style="margin-bottom:8px">
      <div class="vc-tags" style="padding:0">${(v.tags||[]).map(t=>`<span class="tag ${t}">${TAG_EMOJI[t]||''} ${t}</span>`).join('')}</div>
    </div>
    <div style="font-size:12px;color:var(--text-light);margin-bottom:16px">처음 기록: ${v.date||''}</div>
    <div class="detail-section-title">
      <span>📝 기록 & 연구 노트 (${notes.length}개)</span>
      <button class="add-note-btn" onclick="openNoteSheet()">＋ 추가</button>
    </div>
    ${notesHtml || `<div style="text-align:center;padding:20px 0;color:var(--text-light);font-size:13px">아직 기록이 없어요</div>`}
    <div class="detail-section-title" style="margin-top:20px">
      <span>❓ 궁금한 점 (${questions.length}개)</span>
      <button class="add-note-btn" style="background:#FDF3D4;color:#8A6A1A" onclick="openQuestionSheet()">＋ 추가</button>
    </div>
    ${questionsHtml || `<div style="text-align:center;padding:20px 0;color:var(--text-light);font-size:13px">궁금한 점을 기록해두세요</div>`}
  `;
}

/* ── 구절 추가/저장 ───────────────────────────────────────────── */
function openAddSheet(editId) {
  const isEdit = !!editId;
  document.getElementById('addSheetTitle').textContent = isEdit ? '구절 편집' : '새 구절 기록';
  buildTagPicker('tagPicker', TAGS, isEdit ? (state.verses.find(v=>v.id===editId)?.tags||[]) : []);
  if (isEdit) {
    const v = state.verses.find(x=>x.id===editId);
    document.getElementById('fRef').value = v.ref||'';
    document.getElementById('fVer').value = v.version||'개역개정';
    document.getElementById('fText').value = v.text||'';
    document.getElementById('fDate').value = v.date||todayStr();
    document.getElementById('fNote').value = '';
    document.getElementById('addOverlay').dataset.editId = editId;
  } else {
    document.getElementById('fRef').value = '';
    document.getElementById('fVer').value = '개역개정';
    document.getElementById('fText').value = '';
    document.getElementById('fDate').value = todayStr();
    document.getElementById('fNote').value = '';
    delete document.getElementById('addOverlay').dataset.editId;
  }
  openSheet('addOverlay');
}
function saveVerse() {
  const ref = document.getElementById('fRef').value.trim();
  if (!ref) { alert('구절을 입력해주세요.'); return; }
  const editId = document.getElementById('addOverlay').dataset.editId;
  const tags = getSelectedTags('tagPicker');
  const noteText = document.getElementById('fNote').value.trim();
  if (editId) {
    const v = state.verses.find(x=>x.id===editId);
    if (v) {
      v.ref = ref;
      v.version = document.getElementById('fVer').value;
      v.text = document.getElementById('fText').value.trim();
      v.date = document.getElementById('fDate').value;
      v.tags = tags;
    }
  } else {
    const v = {
      id: Date.now().toString(),
      ref, version: document.getElementById('fVer').value,
      text: document.getElementById('fText').value.trim(),
      date: document.getElementById('fDate').value,
      tags,
      notes: []
    };
    if (noteText) {
      v.notes.push({ tag: tags[0]||'메모', text: noteText, date: todayStr() });
    }
    state.verses.push(v);
  }
  save(); renderList(); closeSheet('addOverlay');
}

/* ── 구절 삭제/편집 ───────────────────────────────────────────── */
function deleteCurrentVerse() {
  if (!confirm('이 구절과 모든 기록을 삭제할까요?')) return;
  state.verses = state.verses.filter(v=>v.id!==currentVerseId);
  save(); renderList(); closeSheet('detailOverlay');
}
function editCurrentVerse() {
  closeSheet('detailOverlay');
  setTimeout(() => openAddSheet(currentVerseId), 300);
}

/* ── 노트 시트 ────────────────────────────────────────────────── */
function openNoteSheet(noteIdx) {
  editingNoteIndex = (noteIdx !== undefined) ? noteIdx : null;
  editingNoteVerseId = currentVerseId;
  const v = state.verses.find(x=>x.id===currentVerseId);
  const existing = (noteIdx !== undefined) ? v.notes[noteIdx] : null;
  document.getElementById('noteSheetTitle').textContent = existing ? '기록 편집' : '기록 추가';
  buildTagPicker('noteTagPicker', ['연구','묵상','기도','암송','깨달음','메모'], existing ? [existing.tag] : []);
  document.getElementById('nText').value = existing ? existing.text : '';
  openSheet('noteOverlay');
}
function saveNote() {
  const text = document.getElementById('nText').value.trim();
  if (!text) { alert('내용을 입력해주세요.'); return; }
  const tag = getSelectedTags('noteTagPicker')[0] || '메모';
  const v = state.verses.find(x=>x.id===editingNoteVerseId);
  if (!v) return;
  if (editingNoteIndex !== null) {
    v.notes[editingNoteIndex] = { ...v.notes[editingNoteIndex], tag, text, date: todayStr() };
  } else {
    if (!v.notes) v.notes = [];
    v.notes.push({ tag, text, date: todayStr() });
    // 태그도 자동 추가
    if (!v.tags.includes(tag)) v.tags.push(tag);
  }
  save(); closeSheet('noteOverlay');
  setTimeout(() => { openDetail(editingNoteVerseId); }, 300);
}
function editNote(i) {
  closeSheet('detailOverlay');
  setTimeout(() => { openNoteSheet(i); }, 300);
}
function deleteNote(i) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  const v = state.verses.find(x=>x.id===currentVerseId);
  v.notes.splice(i, 1);
  save(); renderDetail();
}

/* ── 질문 기록 ────────────────────────────────────────────────── */
let editingQuestionIndex = null;

function openQuestionSheet(qIdx) {
  editingQuestionIndex = (qIdx !== undefined) ? qIdx : null;
  const v = state.verses.find(x=>x.id===currentVerseId);
  const existing = (qIdx !== undefined) ? (v.questions||[])[qIdx] : null;
  document.getElementById('questionSheetTitle').textContent = existing ? '질문 편집' : '질문 기록';
  document.getElementById('qText').value = existing ? existing.text : '';
  openSheet('questionOverlay');
}
function saveQuestion() {
  const text = document.getElementById('qText').value.trim();
  if (!text) { alert('질문 내용을 입력해주세요.'); return; }
  const v = state.verses.find(x=>x.id===currentVerseId);
  if (!v.questions) v.questions = [];
  if (editingQuestionIndex !== null) {
    v.questions[editingQuestionIndex] = { text, date: todayStr() };
  } else {
    v.questions.push({ text, date: todayStr() });
  }
  save(); closeSheet('questionOverlay');
  setTimeout(() => renderDetail(), 50);
}
function editQuestion(i) {
  openQuestionSheet(i);
}
function deleteQuestion(i) {
  if (!confirm('이 질문을 삭제할까요?')) return;
  const v = state.verses.find(x=>x.id===currentVerseId);
  v.questions.splice(i, 1);
  save(); renderDetail();
}

/* ── 통계 ─────────────────────────────────────────────────────── */
function renderStats() {
  const el = document.getElementById('statsContent');
  const total = state.verses.length;
  const noteTotal = state.verses.reduce((a,v)=>a+(v.notes||[]).length,0);
  const tagCounts = {};
  TAGS.forEach(t => tagCounts[t] = 0);
  state.verses.forEach(v => (v.tags||[]).forEach(t => { if (tagCounts[t]!==undefined) tagCounts[t]++; }));
  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">수집 구절</div></div>
      <div class="stat-card"><div class="stat-num">${noteTotal}</div><div class="stat-label">기록 노트</div></div>
      <div class="stat-card"><div class="stat-num">${tagCounts['암송']||0}</div><div class="stat-label">암송 구절</div></div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rs-lg);padding:18px;margin-bottom:12px">
      <div class="detail-section-title" style="margin-bottom:14px"><span>활동별 현황</span></div>
      ${TAGS.map(t => `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="width:60px;font-size:12px;font-weight:700;color:var(--text-mid)">${TAG_EMOJI[t]} ${t}</span>
          <div style="flex:1;background:var(--surface2);border-radius:4px;height:8px;overflow:hidden">
            <div style="height:100%;background:var(--accent);border-radius:4px;width:${total?Math.round((tagCounts[t]/total)*100):0}%;transition:width .4s"></div>
          </div>
          <span style="font-size:12px;color:var(--text-light);width:20px;text-align:right">${tagCounts[t]}</span>
        </div>`).join('')}
    </div>
    ${total===0?`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">아직 기록이 없어요</div></div>`:''}
  `;
}

/* ── 묵상 메모 탭 ─────────────────────────────────────────────── */
function renderMemo() {
  const el = document.getElementById('memoContent');
  const notes = [];
  state.verses.forEach(v => {
    (v.notes||[]).forEach(n => {
      if (['묵상','기도','깨달음'].includes(n.tag)) {
        notes.push({ ...n, ref: v.ref });
      }
    });
  });
  if (!notes.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🤍</div><div class="empty-title">묵상 기록이 없어요</div><div class="empty-sub">구절에 묵상, 기도, 깨달음을 추가하면<br>여기서 모아볼 수 있어요</div></div>`;
    return;
  }
  el.innerHTML = notes.slice().reverse().map(n => `

function openBackup() {

}
function renderBackup() {
  const el = document.getElementById('backupBody');
  el.innerHTML = `
    <div class="backup-card">
      <div class="backup-card-title">📤 데이터 내보내기</div>

      <button class="backup-btn primary" onclick="downloadBackup()">📥 JSON 파일로 다운로드</button>
      <button class="backup-btn" onclick="copyBackup()">📋 클립보드에 복사</button>
    </div>
    <div class="backup-card">
      <div class="backup-card-title">📂 데이터 복원</div>
      <div class="backup-card-sub">이전에 백업한 JSON 파일을 선택하면 데이터가 복원됩니다.<br><strong>⚠️ 현재 데이터가 모두 교체됩니다.</strong></div>
      <button class="backup-btn" onclick="document.getElementById('restoreInput').click()">📁 백업 파일 선택</button>
      <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="handleRestoreFile(event)">
      <div id="restoreMsg"></div>
    </div>
  `;
}
function makeBackup() {
  return JSON.stringify({ version:1, exportedAt: new Date().toISOString(), ...state }, null, 2);
}
function downloadBackup() {
  const blob = new Blob([makeBackup()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `biblitory_backup_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function copyBackup() {
  navigator.clipboard.writeText(makeBackup()).then(() => {
    alert('클립보드에 복사됐어요!');
  });
}
function handleRestoreFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed.verses) throw new Error('형식 오류');
      window._restoreData = parsed;
      const msg = document.getElementById('restoreMsg');
      msg.innerHTML = `<div class="restore-msg">📦 구절 ${parsed.verses.length}개 발견됨\n내보낸 날짜: ${(parsed.exportedAt||'').slice(0,10)}\n\n<button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="confirmRestore()">복원 시작하기</button></div>`;
    } catch { document.getElementById('restoreMsg').innerHTML = '<div class="restore-msg" style="color:#C0392B">❌ 올바른 Bibling 백업 파일이 아닙니다.</div>'; }
  };
  reader.readAsText(file);
}
function confirmRestore() {
  const parsed = window._restoreData;
  if (!parsed) return;
  if (!confirm('현재 데이터가 모두 교체됩니다. 복원할까요?')) return;
  state = { verses: parsed.verses };
  save(); renderList(); closeSheet('backupOverlay');
  alert('✅ 복원 완료!');
  window._restoreData = null;
}

const READING_KEY = 'bibling_reading_v1';
let readingState = {};

function loadReading() {
  try { readingState = JSON.parse(localStorage.getItem(READING_KEY)) || {}; }
  catch { readingState = {}; }
}
function saveReading() { localStorage.setItem(READING_KEY, JSON.stringify(readingState)); }

function toggleChapter(book, ch) {
  const key = `${book}:${ch}`;
  readingState[key] = !readingState[key];
  saveReading();
  // 해당 칸만 업데이트
  const el = document.getElementById(`ch-${book}-${ch}`);
  if (el) {
    el.className = readingState[key] ? 'ch-box ch-done' : 'ch-box';
    el.textContent = ch;
  }
  // 해당 책 진행률 업데이트
  const book_data = BIBLE_BOOKS.find(b => b.n === book);
  if (!book_data) return;
  const done = Array.from({length: book_data.c}, (_,i) => readingState[`${book}:${i+1}`]).filter(Boolean).length;
  const pct = Math.round(done / book_data.c * 100);
  const pctEl = document.getElementById(`pct-${book}`);
  const barEl = document.getElementById(`bar-${book}`);
  if (pctEl) pctEl.textContent = pct === 100 ? '✓' : `${pct}%`;
  if (barEl) barEl.style.width = `${pct}%`;
  // 전체 요약 업데이트
  updateTotalProgress();
}

function updateTotalProgress() {
  const total = BIBLE_BOOKS.reduce((a,b) => a + b.c, 0);
  const done = Object.values(readingState).filter(Boolean).length;
  const pct = Math.round(done / total * 100);
  const el = document.getElementById('total-progress');
  if (el) el.textContent = `${done} / ${total} 장 (${pct}%)`;
  const bar = document.getElementById('total-bar');
  if (bar) bar.style.width = `${pct}%`;
}

function renderReading() {
  const total = BIBLE_BOOKS.reduce((a,b) => a + b.c, 0);
  const done = Object.values(readingState).filter(Boolean).length;
  const pct = Math.round(done / total * 100);

  let html = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rs-lg);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-family:'Nanum Square Neo',sans-serif;font-weight:800;font-size:15px">전체 진행률</div>
        <div id="total-progress" style="font-size:12px;font-weight:700;color:var(--accent-deep)">${done} / ${total} 장 (${pct}%)</div>
      </div>
      <div style="background:var(--surface2);border-radius:4px;height:8px;overflow:hidden">
        <div id="total-bar" style="height:100%;background:var(--accent-deep);border-radius:4px;width:${pct}%;transition:width .3s"></div>
      </div>
    </div>`;

  // 구약/신약 섹션
  ['구약','신약'].forEach(testament => {
    const books = BIBLE_BOOKS.filter(b => b.t === testament);
    html += `<div style="font-size:11px;font-weight:800;color:var(--text-light);letter-spacing:1px;margin-bottom:10px;margin-top:4px">${testament}</div>`;
    books.forEach(book => {
      const doneCh = Array.from({length: book.c}, (_,i) => readingState[`${book.n}:${i+1}`]).filter(Boolean).length;
      const bPct = Math.round(doneCh / book.c * 100);
      const isComplete = doneCh === book.c;
      // 장 칸 그리드
      const chapters = Array.from({length: book.c}, (_,i) => {
        const ch = i + 1;
        const isDone = !!readingState[`${book.n}:${ch}`];
        return `<div id="ch-${book.n}-${ch}" class="ch-box ${isDone?'ch-done':''}" onclick="toggleChapter('${book.n}',${ch})">${ch}</div>`;
      }).join('');

      html += `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rs-lg);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)">
          <div style="padding:12px 14px 8px;display:flex;align-items:center;gap:10px">
            <div style="font-family:'Nanum Square Neo',sans-serif;font-weight:800;font-size:13px;flex:1;color:${isComplete?'var(--accent-deep)':'var(--text)'}">${book.n}${isComplete?' ✓':''}</div>
            <div id="pct-${book.n}" style="font-size:11px;font-weight:700;color:var(--accent-deep);min-width:28px;text-align:right">${isComplete?'✓':`${bPct}%`}</div>
          </div>
          <div style="padding:0 14px 6px">
            <div style="background:var(--surface2);border-radius:3px;height:4px;overflow:hidden;margin-bottom:10px">
              <div id="bar-${book.n}" style="height:100%;background:var(--accent);border-radius:3px;width:${bPct}%"></div>
            </div>
          </div>
          <div class="ch-grid" style="padding:0 14px 12px">${chapters}</div>
        </div>`;
    });
  });

  document.getElementById('readingContent').innerHTML = html;
}

function toggleTag(el, containerId) {

    document.querySelectorAll(`#${containerId} .tag-opt`).forEach(e => e.classList.remove('sel'));
  }
  el.classList.toggle('sel');
}
function getSelectedTags(containerId) {
  return [...document.querySelectorAll(`#${containerId} .tag-opt.sel`)].map(e => e.textContent.trim().replace(/^[^ ]+ /,''));
}
function openSheet(id) { document.getElementById(id).classList.add('open'); }
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function closeIfBg(e, id) { if (e.target === document.getElementById(id)) closeSheet(id); }

/* ── 초기화 ───────────────────────────────────────────────────── */
load();
loadReading();
renderList();
renderDailyWord();

// iOS 사파리 붙여넣기 버그 방지: 모든 textarea를 plain text만 받게
document.addEventListener('paste', function(e) {
  const target = e.target;
  if (target.tagName !== 'TEXTAREA') return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  const start = target.selectionStart;
  const end = target.selectionEnd;
  const current = target.value;
  target.value = current.slice(0, start) + text + current.slice(end);
  target.selectionStart = target.selectionEnd = start + text.length;
  target.dispatchEvent(new Event('input'));
});
</script>
